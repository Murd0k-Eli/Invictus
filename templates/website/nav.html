{% load static %}
{% block head %}
    <link rel="stylesheet" href="{% static 'scripts/nav.css' %}">
{% endblock head %}
<nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">Invictus</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}"> Home </a>
                </li>
                <li class="nav-item blog-dropdown">
                    <a class="nav-link {% if request.resolver_match.url_name == 'blog' %}active{% endif %}" href="{% url 'blog' %}"> <span class = "dropdown-arrow">▾</span> Blog </a>
                    <ul class="blog-dropdown-menu">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'blog' %}active{% endif %}" href="{% url 'blog' %}"> Blog </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'featured' %}active{% endif %}" href="{% url 'featured' %}"> Featured </a>
                        </li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav">
                {% if request.user.is_authenticated %}
                    <li class="nav-item profile-dropdown">
                        <a class="nav-link" href="{% url 'dashboard' %}">{{user.username}}<span class="dropdown-arrow">▾</span></a>
                        <ul class="profile-dropdown-menu">
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'dashboard' %}">{{user.username}}</a>
                            </li>
                            <li class="nav-item">
                                <!-- The form remains hidden or inline -->
                                <form id="logout-form" action="{% url 'logout' %}" method="post" style="display: none;">
                                    {% csrf_token %}
                                </form>

                                <!-- The actual link that the user sees and clicks -->
                                <a class="nav-link" href="#" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                                    SignOut
                                </a>
                            </li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">SignIn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}">SignUp</a>
                    </li>
                {% endif %}    
            </ul>
        </div>
    </div>
</nav>
