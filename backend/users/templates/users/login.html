<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Invictus</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Account Login</h2>
        
        <form method="post">
            {% csrf_token %} <!-- Crucial security token for form submission -->
            
            {% if form.errors %}
                <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_username">Username</label>
                <input class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" name="username" id="id_username" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="id_password">Password</label>
                <input class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" type="password" name="password" id="id_password" required>
            </div>
            
            <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-200" type="submit">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
